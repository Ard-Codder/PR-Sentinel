[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Local agent that reviews GitHub pull requests assigned to you with an OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls a live LM Studio server",
]
addopts = ["-m", "not integration"]
